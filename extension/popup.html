<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PebelAI Careers</title>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Base */
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --primary: #0A6A47;
      --primary-hover: #08553a;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 320px;
      min-height: 200px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #13211b 55%, #14532d 100%);
      padding: 16px;
      color: white;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 img {
      width: 20px;
      height: 20px;
    }

    .header p {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
    }

    /* Content */
    .content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Results */
    .results {
      max-height: 150px;
      overflow-y: auto;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-role {
      font-size: 12px;
      font-weight: 600;
    }

    .result-company {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      border-radius: 999px;
    }

    .badge-success {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-warning {
      background: #fef3c7;
      color: #92400e;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 20px;
    }

    .empty p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      PebelAI Careers
    </h1>
    <p>AI-powered recruiter outreach</p>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="sentCount">-</div>
        <div class="stat-label">Sent</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="pendingCount">-</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="responseRate">-%</div>
        <div class="stat-label">Response</div>
      </div>
    </div>

    <!-- Quick Generate -->
    <div class="form-group">
      <label>Resume</label>
      <select id="resumeSelect">
        <option value="">Loading...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Search recruiters</label>
      <input type="text" id="searchInput" placeholder="e.g. data analyst, Power BI">
    </div>

    <button class="btn btn-primary" id="searchBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      Find Recruiters
    </button>

    <div id="results" class="results"></div>

    <button class="btn btn-secondary" id="dashboardBtn">
      Open Full Dashboard
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
