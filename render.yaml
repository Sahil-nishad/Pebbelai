# PebelAI Careers API - Render Configuration
# Connects to your existing Supabase PostgreSQL

services:
  - type: web
    name: pebelai-careers-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    plan: starter
    disk:
      name: pebelai-careers-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        # TODO: Add your Supabase connection string in Render dashboard
        # Format: postgresql+psycopg://postgres.[project]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
        sync: false
      - key: FRONTEND_APP_URL
        value: https://pebelai.com
      - key: CAREERS_INTERNAL_API_KEY
        # TODO: Set in Render dashboard - use same as frontend
        sync: false
      - key: UPLOAD_DIR
        value: /app/storage/resumes
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false

# Note: Remove databases section - using Supabase instead
