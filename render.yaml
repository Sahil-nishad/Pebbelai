services:
  - type: web
    name: pebelai-careers-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    plan: starter
    disk:
      name: pebelai-careers-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pebelai-careers-db
          property: connectionString
      - key: FRONTEND_APP_URL
        sync: false
      - key: CAREERS_INTERNAL_API_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/storage/resumes
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: pebelai-careers-db
    plan: starter
