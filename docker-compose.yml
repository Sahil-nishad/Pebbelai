version: "3.9"

services:
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CAREERS_API_URL: http://backend:8000
      CAREERS_INTERNAL_API_KEY: change-me
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pebelai
      REDIS_URL: redis://redis:6379/0
      CAREERS_INTERNAL_API_KEY: change-me
      FRONTEND_APP_URL: http://localhost:3000
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pebelai
      REDIS_URL: redis://redis:6379/0
      CAREERS_INTERNAL_API_KEY: change-me
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pebelai
      REDIS_URL: redis://redis:6379/0
      CAREERS_INTERNAL_API_KEY: change-me
    depends_on:
      - redis
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pebelai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pebelai-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pebelai-postgres:
